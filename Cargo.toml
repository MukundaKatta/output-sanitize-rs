[package]
name = "output-sanitize-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Strip dangerous HTML/SQL/shell snippets from LLM output before render, query, or shell sinks. Rust port of @mukundakatta/llm-output-sanitizer. Zero deps."
authors = ["Mukunda Rao Katta <mukunda.vjcs6@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MukundaKatta/output-sanitize-rs"
homepage = "https://github.com/MukundaKatta/output-sanitize-rs"
documentation = "https://docs.rs/output-sanitize-rs"
readme = "README.md"
keywords = ["sanitize", "xss", "sql-injection", "shell-injection", "llm"]
categories = ["text-processing"]
exclude = [".github/*", "target/*"]
